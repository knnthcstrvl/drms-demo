# Testing lang

# .github/workflows/deploy.yml
name: Deploy Laravel 10 to /var/www/html/drms

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: student-records

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to /var/www/html/drms via rsync
        run: |
          echo "Syncing Laravel app to /var/www/html/drms"
          sudo rsync -av --delete --exclude=".git" --exclude="node_modules" --no-times --exclude=".env" ./ /var/www/html/drms

      - name: Set permissions
        run: |
          sudo chown -R www-data:systemadmin /var/www/html/drms
          sudo chmod -R 775 /var/www/html/drms/storage /var/www/html/drms/bootstrap/cache

      - name: Install PHP dependencies
        run: |
          cd /var/www/html/drms
          composer install --no-dev --optimize-autoloader
          composer update
          npm install && npm run build
          npm update
# composer require laravel/sanctum:*
      - name: Run Laravel setup commands
        run: |
          cd /var/www/html/drms
          php artisan storage:link
